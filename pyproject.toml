[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttc-platform"
version = "0.1.0"
description = "Toronto TTC subway delay data platform: CKAN ingestion, DuckDB medallion pipeline, dbt gold models, data-quality reporting."
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.3.2",
  "pandas>=2.1,<2.3",
  "pyarrow>=14,<19",
  "openpyxl>=3.1,<3.2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "dbt-duckdb>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
